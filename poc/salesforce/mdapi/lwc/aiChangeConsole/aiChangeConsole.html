<template>
    <lightning-card title="AI Change Console" icon-name="standard:apex">
        <span slot="actions">
            <lightning-badge label={status} class="slds-m-right_x-small"></lightning-badge>
            <template if:true={hasRequest}>
                <lightning-button label="Refresh" onclick={handleRefresh}
                    disabled={loading}></lightning-button>
                <lightning-button label="New request" class="slds-m-left_xx-small"
                    onclick={handleReset} disabled={loading}></lightning-button>
            </template>
        </span>

        <div class="slds-var-p-horizontal_medium">
            <template if:true={loading}>
                <lightning-spinner alternative-text="Working" size="small"></lightning-spinner>
            </template>

            <!-- Step 1: the ask -->
            <template if:false={hasRequest}>
                <lightning-textarea label="What do you need changed?"
                    placeholder="Update HFN logic so reactivating a provider does not generate a duplicate HFN"
                    value={requestText} onchange={handleText}></lightning-textarea>

                <lightning-radio-group class="slds-var-m-top_small"
                    name="requestType" label="Request type" type="button"
                    options={typeOptions} value={requestType}
                    onchange={handleType}></lightning-radio-group>

                <div class="slds-var-m-top_medium">
                    <p class="slds-text-title_caps slds-var-m-bottom_xx-small">Model</p>
                    <template for:each={models} for:item="m">
                        <lightning-button key={m.name} label={m.name} variant={m.variant}
                            data-model={m.name} onclick={handleModel}
                            class="slds-m-right_xx-small"></lightning-button>
                    </template>
                </div>

                <div class="slds-var-m-top_medium slds-var-m-bottom_small">
                    <lightning-button variant="brand" label="Search the graph"
                        onclick={handleSubmit} disabled={submitDisabled}></lightning-button>
                    <p class="slds-text-body_small slds-text-color_weak slds-var-m-top_xx-small">
                        The knowledge graph is searched first. The model is only called
                        after you approve what the graph found.
                    </p>
                </div>
            </template>

            <!-- Step 2: what the graph found -->
            <template if:true={showAnalysis}>
                <div class="slds-box slds-box_x-small slds-var-m-bottom_small">
                    <p class="slds-text-heading_small">{requestName}</p>
                    <p class="slds-var-m-top_xx-small">{analysisSummary}</p>
                    <p class="slds-text-body_small slds-text-color_weak slds-var-m-top_xx-small">
                        Snapshot {snapshotId} &middot; {findingCount} connected components
                    </p>
                </div>

                <lightning-datatable key-field="Id" data={findings}
                    columns={findingColumns} hide-checkbox-column
                    wrap-text-max-lines="3"></lightning-datatable>
            </template>

            <!-- Step 3: generated change -->
            <template if:true={showArtifacts}>
                <h3 class="slds-text-heading_small slds-var-m-vertical_small">
                    Proposed change
                </h3>
                <template for:each={artifacts} for:item="a">
                    <div key={a.Id} class="slds-box slds-box_x-small slds-var-m-bottom_x-small">
                        <p class="slds-text-title_bold">
                            {a.Operation__c} {a.Metadata_Type__c} &middot; {a.Api_Name__c}
                        </p>
                        <p class="slds-text-body_small slds-var-m-top_xx-small">
                            {a.Diff_Summary__c}
                        </p>
                        <pre class="slds-box slds-box_xx-small slds-var-m-top_x-small
                                    slds-scrollable">{a.Source_Body__c}</pre>
                    </div>
                </template>
            </template>

            <!-- Step 4: tests -->
            <template if:true={showTests}>
                <h3 class="slds-text-heading_small slds-var-m-vertical_small">
                    Test results
                </h3>
                <lightning-datatable key-field="Id" data={testResults}
                    columns={testColumns} hide-checkbox-column></lightning-datatable>
            </template>

            <!-- Approval gate -->
            <template if:true={atAnyGate}>
                <div class="slds-box slds-theme_shade slds-var-m-vertical_medium">
                    <p class="slds-var-m-bottom_x-small">{gateLabel}</p>
                    <lightning-button variant="success" label="Approve"
                        onclick={handleApprove} disabled={loading}></lightning-button>
                    <lightning-button variant="destructive-text" label="Reject"
                        class="slds-m-left_xx-small" onclick={handleReject}
                        disabled={loading}></lightning-button>
                </div>
            </template>

            <template if:true={errorMessage}>
                <div class="slds-var-m-vertical_small">
                    <lightning-formatted-text value={errorMessage}
                        class="slds-text-color_error"></lightning-formatted-text>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
