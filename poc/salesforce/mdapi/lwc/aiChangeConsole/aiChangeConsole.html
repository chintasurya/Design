<template>
    <lightning-card icon-name="standard:apex">
        <h1 slot="title" class="slds-text-heading_small">
            Engineering Context Console
            <span class="slds-text-body_small slds-text-color_weak
                         slds-var-m-left_x-small">Network Services</span>
        </h1>
        <span slot="actions">
            <template if:true={hasRequest}>
                <lightning-badge label={status}
                    class="slds-m-right_x-small"></lightning-badge>
                <lightning-button label="Refresh" onclick={handleRefresh}
                    disabled={busy}></lightning-button>
                <lightning-button label="New request" class="slds-m-left_xx-small"
                    onclick={handleReset} disabled={busy}></lightning-button>
            </template>
        </span>

        <div class="slds-var-p-horizontal_medium slds-var-p-bottom_medium">

            <!-- ask -->
            <div class={graphClass}>
                <lightning-icon icon-name="utility:hierarchy" size="xx-small"
                    class="slds-var-m-right_x-small"></lightning-icon>
                <span>{graphLabel}</span>
                <lightning-button label={buildLabel} variant="base"
                    class="slds-m-left_small" onclick={handleBuildGraph}
                    disabled={building}></lightning-button>
            </div>

            <template if:true={scopeWarning}>
                <div class="scopewarn">
                    <lightning-icon icon-name="utility:warning" size="xx-small"
                        class="slds-var-m-right_x-small"></lightning-icon>
                    <div>
                        <p>{scopeWarning}</p>
                        <a class="summaryline__toggle"
                           onclick={toggleProfiles}>{profileToggleLabel}</a>
                        <template if:true={showProfiles}>
                            <lightning-input type="search" label="Filter profiles"
                                variant="label-hidden" placeholder="Type to filter"
                                value={profileFilter}
                                onchange={handleProfileFilter}
                                class="slds-var-m-top_x-small"></lightning-input>
                            <p class="slds-text-body_small slds-text-color_weak
                                      slds-var-m-top_xx-small">{profileCountLabel}</p>
                            <ul class="evidence profilelist slds-var-m-top_x-small">
                                <template for:each={profiles} for:item="p">
                                    <li key={p.name}>
                                        <strong>{p.name}</strong> — {p.detail}
                                    </li>
                                </template>
                            </ul>
                            <p class="slds-text-body_small slds-var-m-top_x-small">
                                Set the exact name on Custom Metadata Types,
                                AI POC Config, Default, field Pod Profile Name.
                            </p>
                        </template>
                    </div>
                </div>
            </template>

            <div class="composer">
                <lightning-textarea
                    label={composerLabel}
                    placeholder="Describe the change in your own words"
                    value={requestText} onchange={handleText}></lightning-textarea>

                <div class="slds-var-m-top_medium">
                    <lightning-button variant="brand" label={submitLabel}
                        onclick={handleSubmit} disabled={analyseDisabled}></lightning-button>
                    <p class="slds-text-body_small slds-text-color_weak
                              slds-var-m-top_xx-small">
                        Just describe it. Whether this is new or a change to
                        something that already exists is what the analysis is
                        for, and no model is called until you approve what the
                        graph found.
                    </p>
                </div>
            </div>

            <template if:true={hasResult}>
                <hr class="slds-var-m-vertical_small" />
            </template>

            <!-- live pipeline, collapses to one line once finished -->
            <template if:true={showStepList}>
                <ul class="slds-var-m-bottom_small">
                    <template for:each={steps} for:item="s">
                        <li key={s.key} class={s.css}>
                            <lightning-icon icon-name={s.icon} size="xx-small"
                                class="slds-var-m-right_x-small step__icon"></lightning-icon>
                            <span class="step__label">{s.label}</span>
                            <template if:true={s.elapsed}>
                                <span class="step__elapsed">{s.elapsed}</span>
                            </template>
                            <template if:true={s.detail}>
                                <div class="step__detail">{s.detail}</div>
                            </template>
                        </li>
                    </template>
                </ul>
            </template>

            <template if:true={showStepSummary}>
                <div class={stepsSummaryClass}>
                    <lightning-icon icon-name={stepsSummaryIcon} size="xx-small"
                        class="slds-var-m-right_x-small"></lightning-icon>
                    <span>{stepsSummary}</span>
                    <a class="summaryline__toggle"
                       onclick={toggleSteps}>{toggleLabel}</a>
                </div>
            </template>

            <template if:true={stepsExpanded}>
                <div class="slds-var-m-bottom_small">
                    <a class="summaryline__toggle"
                       onclick={toggleSteps}>{toggleLabel}</a>
                </div>
            </template>

            <!-- verdict -->
            <template if:true={verdict}>
                <div class={verdictClass}>
                    <div class="slds-media slds-media_small">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name={verdictIcon}
                                size="small"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <p class="slds-text-title_caps
                                      slds-text-color_weak">{verdict.outcome}</p>
                            <p class="slds-text-heading_small
                                      slds-var-m-top_xx-small">{verdict.headline}</p>
                            <p class="slds-var-m-top_x-small">{verdict.detail}</p>
                            <p class="slds-var-m-top_x-small slds-text-body_small">
                                <strong>Recommendation.</strong> {verdict.recommendation}
                            </p>
                            <template if:true={verdict.evidence.length}>
                                <ul class="slds-var-m-top_x-small evidence">
                                    <template for:each={verdict.evidence} for:item="e">
                                        <li key={e}>{e}</li>
                                    </template>
                                </ul>
                            </template>
                        </div>
                    </div>
                </div>
            </template>

            <!-- findings -->
            <template if:true={hasFindings}>
                <div class="slds-grid slds-grid_align-spread slds-var-m-bottom_xx-small">
                    <h2 class="slds-text-title_caps">
                        What this touches in the org
                    </h2>
                    <span class="slds-text-body_small
                                 slds-text-color_weak">{snapshotLine}</span>
                </div>
                <div class="findings">
                    <lightning-datatable key-field="Id" data={findings}
                        columns={findingColumns} hide-checkbox-column
                        wrap-text-max-lines="2"></lightning-datatable>
                </div>
            </template>

            <!-- generated change -->
            <template if:true={showArtifacts}>
                <h2 class="slds-text-title_caps slds-var-m-vertical_small">
                    Proposed change
                </h2>
                <template for:each={artifacts} for:item="a">
                    <div key={a.Id}
                         class="slds-box slds-box_x-small slds-var-m-bottom_x-small">
                        <p class="slds-text-title_bold">
                            {a.Operation__c} {a.Metadata_Type__c} · {a.Api_Name__c}
                        </p>
                        <p class="slds-text-body_small
                                  slds-var-m-top_xx-small">{a.Diff_Summary__c}</p>
                        <pre class="slds-box slds-box_xx-small slds-var-m-top_x-small
                                    slds-scrollable">{a.Source_Body__c}</pre>
                    </div>
                </template>
            </template>

            <!-- tests -->
            <template if:true={showTests}>
                <h2 class="slds-text-title_caps slds-var-m-vertical_small">
                    Test results
                </h2>
                <lightning-datatable key-field="Id" data={testResults}
                    columns={testColumns} hide-checkbox-column></lightning-datatable>
            </template>

            <!-- the model question, asked only once the analysis is approved -->
            <template if:true={atModelChoice}>
                <div class="slds-box slds-var-m-top_medium modelchoice">
                    <p class="slds-text-heading_small">
                        Do you want me to connect a model to get the logic?
                    </p>
                    <p class="slds-text-body_small slds-text-color_weak
                              slds-var-m-top_xx-small">{modelChoiceNote}</p>
                    <div class="slds-var-m-top_small">
                        <template for:each={models} for:item="m">
                            <lightning-button key={m.name} label={m.name}
                                variant={m.variant} data-model={m.name}
                                onclick={handleChooseModel} disabled={busy}
                                class="slds-m-right_xx-small"></lightning-button>
                        </template>
                    </div>
                    <template if:true={chosenModel}>
                        <p class="slds-text-body_small slds-var-m-top_small">
                            <strong>{chosenModel}</strong> is recorded on this
                            request. Generation, deploy and the Jira write-back
                            are not built yet, so this is where the request
                            stops for now.
                        </p>
                    </template>
                </div>
            </template>

            <!-- gate -->
            <template if:true={atAnyGate}>
                <div class="slds-box slds-theme_shade slds-var-m-top_medium">
                    <p class="slds-var-m-bottom_x-small">{gateLabel}</p>
                    <lightning-button variant="success" label="Approve"
                        onclick={handleApprove} disabled={busy}></lightning-button>
                    <lightning-button variant="destructive-text" label="Reject"
                        class="slds-m-left_xx-small" onclick={handleReject}
                        disabled={busy}></lightning-button>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
